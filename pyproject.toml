[project]
name = "eypstats"
version = "0.1.0"
description = "The platform to measure European Youth Parliament debates"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "pillow>=13.0",
    "dj-database-url",
    "urllib3",
    "django-appconf",
    "django-bootstrap3",
    "django-filter",
    "django-imagekit",
    "django-tables2",
    "docutils",
    "gunicorn",
    "jmespath",
    "mistune>=3.4.0",
    "pilkit",
    "psycopg2-binary>=2.8.6",
    "python-dateutil",
    "pytz",
    "sentry-sdk",
    "six",
    "whitenoise",
    "django_rename_app",
    "django-storages[s3]>=1.14.6",
]
[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
]
docs = [
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.uv.extra-build-dependencies]
django-grip = ["setuptools"]
gripcontrol = ["setuptools"]
pubcontrol = ["setuptools"]
